<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a1510" />
  <title>Metoera Red Zone</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <p class="brand">Metoera</p>
    <p class="sub">Red-zone camera</p>
  </header>

  <main>
    <section class="stage" aria-label="Camera">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <canvas id="work" hidden></canvas>
      <div id="flash" class="flash" hidden></div>
      <p id="camStatus" class="cam-status">Starting camera…</p>
    </section>

    <section class="panel" aria-label="Controls">
      <div class="row status-row">
        <span id="armedBadge" class="badge off">ARM OFF</span>
        <span id="detectBadge" class="badge idle">Idle</span>
      </div>

      <p class="hint">Drag on the video to draw the red zone. It is saved on this phone.</p>

      <div class="row actions">
        <button type="button" id="btnStart" class="btn primary">Start watching</button>
        <button type="button" id="btnClear" class="btn">Clear zone</button>
      </div>

      <label class="arm">
        <input type="checkbox" id="armToggle" />
        <span>
          <strong>ARM drone takeoff</strong>
          <small>Default off. Only enable with a human next to the aircraft.</small>
        </span>
      </label>

      <div class="row actions">
        <button type="button" id="btnTest" class="btn">Test intrusion (no wait)</button>
      </div>

      <p id="message" class="message" role="status"></p>
      <ul id="log" class="log" aria-label="Recent events"></ul>
    </section>
  </main>

  <audio id="siren" preload="auto">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=" type="audio/wav" />
  </audio>
  <script src="/app.js" type="module"></script>
</body>
</html>
